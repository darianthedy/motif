name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued rather than cancelled: a superseded build is
# still a build someone may be waiting on, and Pages deploys are cheap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tests gate the deploy. The whole point of the model layer being pure
      # logic is that this takes milliseconds, so there is no reason to skip it
      # and every reason not to publish a build that fails its own suite.
      - run: npm test

      # Unit tests prove the model; only a browser proves that a tap on a
      # square becomes the right move, that the promotion picker commits the
      # piece you picked, and that a mis-drag stays free.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:e2e

      # Injected at build time, since Vite inlines them into the bundle. They
      # live in repo secrets rather than the tree so the key is not scraped off
      # a public repo and spent against the project's free-tier quota — it is
      # not a security boundary (RLS is), just quota hygiene. Absent, the build
      # still succeeds and ships a local-only app.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
