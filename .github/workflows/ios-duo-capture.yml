name: iOS Duo Capture

# The iPhone Duo screenshot tests (plan D09): every drawn mockup cell, captured in
# each simulator pose of the iPhone Duo and on an iPhone 17, then paired with its
# rendered canvas frame in one contact sheet per canvas tab and pose. Split View
# and pinned video have no simulator control, so those cells stay device-only.
# Manual: the PR check (ios-ci) doesn't run this. See "Motif - iOS iPhone Duo Plan.md" §8–9.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Narrow every pose to these states (e.g. S15,S09a or primary); empty for every drawn cell"
        type: string
        default: ""

jobs:
  # Each pose's drawn cells, read from the canvases (design/iphone-duo/cells.mjs).
  cells:
    runs-on: ubuntu-latest
    outputs:
      only: ${{ steps.cells.outputs.only }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: cells
        run: echo "only=$(node design/iphone-duo/cells.mjs only)" >> "$GITHUB_OUTPUT"

  # The app and the capture suite under the iOS 27.1 SDK.
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Net names
        id: nets
        run: echo "key=nnue-$(scripts/fetch-nnue.sh --names | tr ' ' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: iOS/Motif/Motif/Engine/Nets
          key: ${{ steps.nets.outputs.key }}
      - run: scripts/fetch-nnue.sh
      - run: scripts/ios-duo-capture.sh build
      - run: tar -C build/DerivedData/Build -czf build/products.tgz Products
      - uses: actions/upload-artifact@v4
        with:
          name: products
          path: build/products.tgz

  capture:
    needs: [cells, build]
    runs-on: xcode-27
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        pose: [O, IL, IP, FB, FT, iphone]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - if: matrix.pose != 'iphone'
        run: brew install skarol/tap/duoctl
      - uses: actions/download-artifact@v4
        with:
          name: products
          path: build
      - name: Unpack
        run: mkdir -p build/DerivedData/Build && tar -C build/DerivedData/Build -xzf build/products.tgz
      - name: Capture
        env:
          MOTIF_CAPTURE_ONLY: ${{ inputs.only != '' && inputs.only || fromJSON(needs.cells.outputs.only)[matrix.pose] }}
        # Fails when a state wasn't reached (apart from S12h, and S05a on FB and FT) or a drawn cell has no screenshot.
        run: scripts/ios-duo-capture.sh capture ${{ matrix.pose }} ${{ matrix.pose }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ matrix.pose }}
          path: |
            build/duo-capture/*/
            !build/duo-capture/*.xcresult
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-${{ matrix.pose }}
          path: build/duo-capture/*.xcresult
          if-no-files-found: ignore

  # Every capture beside its mockup frame (render.mjs), one sheet per canvas tab and pose (sheet.mjs).
  sheets:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: capture-*
          path: build/captures
      - run: PLAYWRIGHT_FROM=$PWD/node_modules/ node design/iphone-duo/pair.mjs build/captures build/sheets
      - uses: actions/upload-artifact@v4
        with:
          name: contact-sheets
          path: |
            build/sheets/*/*.png
            build/sheets/*/missing.txt
          if-no-files-found: warn
