name: iOS CI

# The check for the native app: builds it with Xcode 27.1 and runs MotifTests +
# MotifUITests against the in-memory dev backend (no secrets, no signing), on three
# destinations: an iPhone 17 (`iphone`), the iPhone Duo simulator open and wide
# (`IL`, posed with duoctl) and an 11-inch iPad in landscape (`ipad`; the UI tests
# turn it with XCUIDevice). See "Motif - iOS iPhone Duo Plan.md" §9. The web suite, whose
# fixture check fails when a TS model change has left the committed iOS parity fixtures
# stale, runs on every PR in web-ci.yml.
#
# Two depths, picked by the `plan` job:
#   quick — pull requests: the iphone leg only, all of MotifTests plus the UI smoke set
#           (`ios-verify.sh --smoke`), for feedback in about ten minutes.
#   full  — the nightly schedule, workflow_dispatch and PRs labelled `full-ui`:
#           every test on all three legs. Merges to main don't run the iOS check.
#           (workflow_dispatch can ask for the quick one with its `smoke` input, for
#           named tests only with `only`, and keep the xcresult with `keep_results`.)
#
# A failing test gets a second attempt (MOTIF_TEST_RETRIES), so one flaky UI test doesn't
# cost a re-run; a test that passed only on its retry shows as a warning on the run.
#
# Build caching, since every job starts on a fresh Mac: the Swift packages are cached
# on Package.resolved; the build products and Xcode's compilation cache (content
# addressed, so it survives a fresh checkout) are saved by the nightly run's iphone
# leg and restored by every leg and PR, so PRs build on at most a day-old cache. Tracked files get their commit times as mtimes, so
# the cached products of unchanged sources still count as up to date.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "iOS/**"
      - "src/model/**"
      - "scripts/export-ios-fixtures.ts"
      - "scripts/ios-*.sh"
      - "scripts/fetch-nnue.sh"
      - ".github/workflows/ios-ci.yml"
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC, on main
  workflow_dispatch:
    inputs:
      smoke:
        description: "Quick check only (iphone leg, smoke UI set), as on a PR"
        type: boolean
        default: false
      only:
        description: "Run only these tests (comma-separated, e.g. MotifUITests/GamesFlowTests/testBulkDeleteFromTheToolbarItem)"
        type: string
        default: ""
      keep_results:
        description: "Upload the xcresult even when the tests pass"
        type: boolean
        default: false

# A PR's newer run replaces its older one. Adding some other label to a PR gets a
# group of its own, so it can't cancel the running check (its jobs are skipped).
# main's runs (nightly, dispatch) are never cancelled.
concurrency:
  group: ios-ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ui' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # A label event re-runs the check only when it's `full-ui` being added.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ui'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - id: plan
        env:
          FULL: ${{ (github.event_name == 'workflow_dispatch' && !inputs.smoke) || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ui') }}
        run: |
          # An iPhone 17 on an iOS 26.x runtime when the image has one, so the 26.1
          # fallbacks run; otherwise on the SDK's own runtime. The step log says which.
          iphone='{"pose":"iphone","sim":"iPhone 17","runtime":"26"}'
          # The capture script's own Duo, made fresh and posed open + landscape.
          duo='{"pose":"IL","sim":"Motif Duo Capture","runtime":""}'
          # An 11-inch iPad (834 × 1194 class, §3 PD), matched by name prefix so the
          # chip suffix of the image's model ("(M5)" …) doesn't matter. FlowTestCase
          # turns it to landscape before each launch (MOTIF_POSE=ipad).
          ipad='{"pose":"ipad","sim":"iPad Pro 11-inch","runtime":""}'
          if [ "$FULL" = true ]; then legs="[$iphone,$duo,$ipad]"; else legs="[$iphone]"; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "### iOS CI: $([ "$FULL" = true ] && echo 'full suite, all legs' || echo 'quick (iphone, smoke UI set) — label the PR `full-ui` for everything')" >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: ios (${{ matrix.pose }}${{ inputs.only != '' && ', only' || needs.plan.outputs.full != 'true' && ', smoke' || '' }})
    needs: plan
    runs-on: xcode-27 # carries Xcode 27.1 and the iPhone Duo simulator (deployment target stays iOS 26.1)
    timeout-minutes: ${{ needs.plan.outputs.full == 'true' && 75 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    # MOTIF_SIM picks the device by name on the selected Xcode's runtimes (MOTIF_RUNTIME
    # preferred), so a renamed runtime on the runner image doesn't break the check;
    # MOTIF_POSE reaches the tests.
    env:
      MOTIF_SIM: ${{ matrix.sim }}
      MOTIF_RUNTIME: ${{ matrix.runtime }}
      MOTIF_POSE: ${{ matrix.pose }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commit times for ios-restore-mtimes.sh

      - name: Restore commit mtimes
        run: scripts/ios-restore-mtimes.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      # The Stockfish nets (~75 MB) change only with the pinned engine, so
      # they're cached on their names. ios-verify.sh runs the fetch too; this
      # step makes a download failure its own red step.
      - name: Net names
        id: nets
        run: echo "key=nnue-$(scripts/fetch-nnue.sh --names | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      - name: Cache NNUE nets
        uses: actions/cache@v4
        with:
          path: iOS/Motif/Motif/Engine/Nets
          key: ${{ steps.nets.outputs.key }}

      - name: Fetch NNUE nets
        run: scripts/fetch-nnue.sh

      # Package checkouts, keyed on the lock file.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ hashFiles('iOS/Motif/Motif.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # main's latest build, whatever this commit is; restore-keys takes the newest.
      # The legs all build the same simulator binaries, so any leg can use it.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: &build-cache |
            build/DerivedData/Build
            build/DerivedData/ModuleCache.noindex
            build/DerivedData/CompilationCache.noindex
          key: dd-xcode27.1-${{ github.sha }}
          restore-keys: dd-xcode27.1-

      # A fresh VM gives every file a new inode; without this XCBuild rebuilds anyway.
      - name: Let XCBuild ignore inode changes
        run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Pose the iPhone Duo
        if: matrix.pose == 'IL'
        run: |
          brew install skarol/tap/duoctl
          scripts/ios-duo-capture.sh pose ${{ matrix.pose }}

      # The same script the Mac used for every slice: build-for-testing, then
      # test-without-building, each with its own timings in the log.
      - name: Build and test on a simulator
        env:
          MOTIF_TEST_RETRIES: 2
          MOTIF_ONLY_TESTING: ${{ inputs.only }}
          SMOKE: ${{ needs.plan.outputs.full != 'true' && '--smoke' || '' }}
          MOTIF_XCODEBUILD_FLAGS: -disableAutomaticPackageResolution COMPILATION_CACHE_ENABLE_CACHING=YES
        run: scripts/ios-verify.sh --ios $SMOKE

      - name: Build cache size
        if: ${{ !cancelled() }}
        run: du -sh build/DerivedData/* 2>/dev/null || true

      # Only main's builds (nightly, or a dispatch on main) seed the cache (a PR's cache would be visible to that PR
      # alone), and one leg is enough. Saved even when a test failed: the build held.
      - name: Save build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.pose == 'iphone' }}
        uses: actions/cache/save@v4
        with:
          path: *build-cache
          key: dd-xcode27.1-${{ github.sha }}

      - name: Upload test results
        if: failure() || (!cancelled() && inputs.keep_results)
        uses: actions/upload-artifact@v4
        with:
          name: Motif-xcresult-${{ matrix.pose }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
