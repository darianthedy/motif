name: iOS Duo Probe

# Temporary: iPhone Duo Phases 0 and 1. Builds with Xcode 27.1, reports which
# simulator controls exist, and screenshots the layout probe on the iPhone Duo
# simulator. Delete with the probe after Phase 1.

on:
  push:
    branches: [iphone-duo-phase-one]
    paths:
      - "iOS/**"
      - "scripts/ios-duo-*.sh"
      - ".github/workflows/ios-duo-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Net names
        id: nets
        run: echo "key=nnue-$(scripts/fetch-nnue.sh --names | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      - name: Cache NNUE nets
        uses: actions/cache@v4
        with:
          path: iOS/Motif/Motif/Engine/Nets
          key: ${{ steps.nets.outputs.key }}

      - name: Fetch NNUE nets
        run: scripts/fetch-nnue.sh

      - name: Probe the iPhone Duo simulator
        run: scripts/ios-duo-probe.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-probe
          path: build/duo-probe
          if-no-files-found: warn
