name: iOS CI

# The PR check for the native app: builds it with Xcode 27.1 and runs MotifTests +
# MotifUITests against the in-memory dev backend (no secrets, no signing), on three
# destinations: an iPhone 17 (`iphone`), the iPhone Duo simulator open and wide
# (`IL`, posed with duoctl) and an 11-inch iPad in landscape (`ipad`; the UI tests
# turn it with XCUIDevice). See "Motif - iOS iPhone Duo Plan.md" §9. Also runs the web suite, whose fixture check fails when a TS model
# change has left the committed iOS parity fixtures stale.

on:
  pull_request:
    paths:
      - "iOS/**"
      - "src/model/**"
      - "scripts/export-ios-fixtures.ts"
      - "scripts/ios-*.sh"
      - "scripts/fetch-nnue.sh"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

  ios:
    name: ios (${{ matrix.pose }})
    runs-on: xcode-27 # carries Xcode 27.1 and the iPhone Duo simulator (deployment target stays iOS 26.1)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # An iPhone 17 on an iOS 26.x runtime when the image has one, so the 26.1
          # fallbacks run; otherwise on the SDK's own runtime. The step log says which.
          - pose: iphone
            sim: iPhone 17
            runtime: "26"
          # The capture script's own Duo, made fresh and posed open + landscape.
          - pose: IL
            sim: Motif Duo Capture
            runtime: ""
          # An 11-inch iPad (834 × 1194 class, §3 PD), matched by name prefix so the
          # chip suffix of the image's model ("(M5)" …) doesn't matter. FlowTestCase
          # turns it to landscape before each launch (MOTIF_POSE=ipad).
          - pose: ipad
            sim: iPad Pro 11-inch
            runtime: ""
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      # The Stockfish nets (~75 MB) change only with the pinned engine, so
      # they're cached on their names. ios-verify.sh runs the fetch too; this
      # step makes a download failure its own red step.
      - name: Net names
        id: nets
        run: echo "key=nnue-$(scripts/fetch-nnue.sh --names | tr ' ' '_')" >> "$GITHUB_OUTPUT"

      - name: Cache NNUE nets
        uses: actions/cache@v4
        with:
          path: iOS/Motif/Motif/Engine/Nets
          key: ${{ steps.nets.outputs.key }}

      - name: Fetch NNUE nets
        run: scripts/fetch-nnue.sh

      - name: Pose the iPhone Duo
        if: matrix.pose == 'IL'
        run: |
          brew install skarol/tap/duoctl
          scripts/ios-duo-capture.sh pose ${{ matrix.pose }}

      # The same script the Mac used for every slice. MOTIF_SIM picks the device by
      # name on the selected Xcode's runtimes (MOTIF_RUNTIME preferred), so a renamed
      # runtime on the runner image doesn't break the check; MOTIF_POSE reaches the tests.
      - name: Build and test on a simulator
        env:
          MOTIF_SIM: ${{ matrix.sim }}
          MOTIF_RUNTIME: ${{ matrix.runtime }}
          MOTIF_POSE: ${{ matrix.pose }}
        run: scripts/ios-verify.sh --ios

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Motif-xcresult-${{ matrix.pose }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
